<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短视频脚本工作室 · AI工作室</title>
  <link rel="stylesheet" href="css/style.css?v=17">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo">
        <div class="logo-icon">🎨</div>
        <span class="logo-text">AI工作室</span>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">工作室</a>
        <a href="#" class="nav-link active">短视频脚本</a>
        <a href="developer.html" class="nav-link">开发者平台</a>
        <a href="#" class="nav-link">我的作品</a>
      </div>
      <div class="nav-right">
        <div class="credit-badge" id="creditBadge">
          <span class="credit-icon">💎</span>
          <b id="creditNum">--</b> 积分
        </div>
        <a href="/profile" class="avatar" id="userAvatar">U</a>
      </div>
    </div>
  </nav>

  <!-- Studio Page -->
  <div class="studio-page">
    <!-- Left Panel -->
    <div class="studio-panel">
      <div class="panel-header">
        <a href="index.html" class="back-btn" title="返回工作室广场">←</a>
        <div class="studio-icon-sm">🎬</div>
        <h2>短视频脚本工作室</h2>
        <button class="action-btn" id="loadTplBtn" style="margin-left:auto;font-size:12px;padding:4px 10px;">📂 模板</button>
      </div>

      <div class="panel-body">
        <!-- 基础信息区 -->
        <div class="form-section">
          <div class="form-section-header">
            <div class="form-section-title">
              <span class="sec-icon">📋</span>基础信息
            </div>
            <span class="form-section-toggle">▼</span>
          </div>
          <div class="form-fields">
            <div class="form-group">
              <label class="form-label">视频类型</label>
              <select class="form-select" id="videoType">
                <option>产品种草</option>
                <option>剧情段子</option>
                <option>知识科普</option>
                <option>好物测评</option>
                <option>美食制作</option>
                <option>旅行vlog</option>
                <option>变装</option>
                <option>搞笑</option>
                <option>口播</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">视频主题 <span class="required">*</span></label>
              <input type="text" class="form-input" id="videoTheme" placeholder="例如：夏季护肤必备单品推荐">
            </div>

            <div class="form-group">
              <label class="form-label">发布平台</label>
              <div class="option-group cols-3">
                <div class="option-item active">抖音</div>
                <div class="option-item active">小红书</div>
                <div class="option-item">视频号</div>
                <div class="option-item">B站</div>
                <div class="option-item">快手</div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">视频时长</label>
              <select class="form-select" id="videoDuration">
                <option>15秒</option>
                <option>30秒</option>
                <option selected>60秒</option>
                <option>90秒</option>
                <option>3分钟+</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 内容与风格区 -->
        <div class="form-section">
          <div class="form-section-header">
            <div class="form-section-title">
              <span class="sec-icon">✨</span>内容与风格
            </div>
            <span class="form-section-toggle">▼</span>
          </div>
          <div class="form-fields">
            <div class="form-group">
              <label class="form-label">核心卖点 / 信息点 <span class="required">*</span></label>
              <textarea class="form-textarea" id="sellingPoints" placeholder="描述产品核心卖点、想要传达的信息点..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">内容风格</label>
              <div class="option-group cols-3">
                <div class="option-item active">搞笑幽默</div>
                <div class="option-item">干货满满</div>
                <div class="option-item">情感共鸣</div>
                <div class="option-item">反转剧情</div>
                <div class="option-item">解压治愈</div>
                <div class="option-item">专业权威</div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">脚本结构</label>
              <div class="option-group cols-2">
                <div class="option-item active">黄金3秒钩子</div>
                <div class="option-item">递进式</div>
                <div class="option-item">对比式</div>
                <div class="option-item">故事型</div>
                <div class="option-item">提问式</div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">生成版本数</label>
              <div class="number-stepper">
                <button class="stepper-btn minus">−</button>
                <input type="number" class="stepper-input" id="videoCount" value="2" min="1" max="5">
                <button class="stepper-btn plus">+</button>
              </div>
              <span class="text-xs text-muted" style="margin-left: 12px;">最多 5 个版本</span>
            </div>
          </div>
        </div>

        <!-- 角色与场景 -->
        <div class="form-section collapsed">
          <div class="form-section-header">
            <div class="form-section-title">
              <span class="sec-icon">🎭</span>角色与场景
            </div>
            <span class="form-section-toggle">▼</span>
          </div>
          <div class="form-fields">
            <div class="form-group">
              <label class="form-label">人物角色</label>
              <div class="tag-input-wrapper" id="characterTags">
                <span class="tag-item">主角<span class="tag-close">×</span></span>
                <input type="text" class="tag-input" placeholder="输入角色设定，回车添加">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">场景描述</label>
              <textarea class="form-textarea" placeholder="描述拍摄场景，例如：温馨的卧室、办公室、咖啡馆..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">BGM风格</label>
              <select class="form-select" id="bgmStyle">
                <option>轻快活泼</option>
                <option>温馨治愈</option>
                <option>燃系</option>
                <option>古风</option>
                <option>电子</option>
                <option>无推荐</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 进阶设置 -->
        <div class="form-section collapsed">
          <div class="form-section-header">
            <div class="form-section-title">
              <span class="sec-icon">🔬</span>进阶设置
            </div>
            <span class="form-section-toggle">▼</span>
          </div>
          <div class="form-fields">
            <div class="form-group">
              <label class="form-label">LLM 模型选择</label>
              <select class="form-select" id="llmModel">
                <option value="">加载中...</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">创意程度</label>
              <div class="slider-container">
                <input type="range" class="slider" min="0" max="100" value="70" data-suffix="%">
                <span class="slider-value">70%</span>
              </div>
              <div class="flex justify-between text-xs text-muted mt-8">
                <span>保守严谨</span>
                <span>创意发散</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">特殊要求 / 补充说明</label>
              <textarea class="form-textarea" placeholder="其他特殊要求，例如：需要包含具体对白、加入特效镜头提示、指定结尾引导语..."></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-footer">
        <div class="cost-info">
          <span class="cost-label">预计消耗</span>
          <span class="cost-value" id="costDisplay">💎 8-20 积分/份</span>
        </div>
        <button class="generate-btn" id="generateBtn">
          <span class="btn-icon">✨</span>生成脚本
        </button>
      </div>
    </div>

    <!-- Right Preview -->
    <div class="preview-area">
      <div class="preview-header">
        <div class="preview-title">
          <span>📄 预览区域</span>
        </div>
        <div class="preview-actions">
          <button class="action-btn" onclick="showToast('已复制全部内容','success')">📋 复制全部</button>
          <button class="action-btn primary" onclick="showToast('已导出为 TXT 文件','success')">📥 导出</button>
        </div>
      </div>

      <div class="preview-content" id="previewContent">
        <div class="preview-empty">
          <div class="empty-icon">🎬</div>
          <h3>生成爆款短视频脚本</h3>
          <p>填写视频主题和核心卖点，选择风格与结构，点击「生成脚本」，AI 将为你创作完整的分镜脚本和口播文案。</p>
          <div style="margin-top: 24px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
            <div style="text-align: center;">
              <div style="font-size: 28px; margin-bottom: 4px;">⚡</div>
              <div class="text-xs text-muted">30秒出稿</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: 28px; margin-bottom: 4px;">🎯</div>
              <div class="text-xs text-muted">分镜脚本</div>
            </div>
            <div style="text-align: center;">
              <div style="font-size: 28px; margin-bottom: 4px;">💡</div>
              <div class="text-xs text-muted">爆款逻辑</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
  <script>
    // 登录检查
    if (!isLoggedIn()) {
      showToast('请先登录', 'error');
      setTimeout(() => window.location.href = '/login', 800);
    }

    initCommonComponents();

    // 动态加载文本模型
    async function loadModels() {
      const data = await apiRequest('/api/models?type=text');
      if (data.code === 0) {
        const select = document.getElementById('llmModel');
        if (select && data.data.length > 0) {
          select.innerHTML = data.data.map(m => 
            `<option value="${m.id}">${m.name} (${m.model_identifier}) - ${m.price_per_call}积分/版本${m.is_default ? ' · 默认' : ''}</option>`
          ).join('');
          updateCost();
        }
      }
    }

    function updateCost() {
      const count = parseInt(document.getElementById('videoCount').value) || 1;
      const modelId = document.getElementById('llmModel')?.value;
      if (!modelId || isNaN(modelId)) {
        document.getElementById('costDisplay').textContent = '💎 8-20 积分/份';
        return;
      }
      
      apiRequest('/api/calculate-cost', {
        method: 'POST',
        body: JSON.stringify({ model_id: parseInt(modelId), count })
      }).then(data => {
        if (data.code === 0) {
          document.getElementById('costDisplay').textContent = '💎 ' + data.data.cost + ' 积分';
        }
      });
    }

    // 获取选中的选项文本（多选用逗号连接）
    function getActiveOptionsText(selector) {
      const actives = document.querySelectorAll(selector);
      return Array.from(actives).map(el => el.textContent.trim());
    }
    function getActiveOptionText(selector) {
      const active = document.querySelector(selector);
      return active ? active.textContent.trim() : '';
    }

    // 收集表单数据
    function getFormData() {
      const count = parseInt(document.getElementById('videoCount').value) || 2;
      const theme = document.getElementById('videoTheme').value.trim();
      const sellingPoints = document.getElementById('sellingPoints').value.trim();
      
      return {
        model_id: parseInt(document.getElementById('llmModel').value),
        video_type: document.getElementById('videoType').value,
        topic: theme,
        platforms: getActiveOptionsText('.form-section:nth-of-type(2) .option-item.active'),
        duration: document.getElementById('videoDuration').value,
        selling_points: sellingPoints,
        content_style: getActiveOptionText('.form-section:nth-of-type(2) .form-group:nth-of-type(2) .option-item.active') || '搞笑幽默',
        script_structure: getActiveOptionText('.form-section:nth-of-type(2) .form-group:nth-of-type(3) .option-item.active') || '黄金3秒钩子',
        count: count,
        characters: Array.from(document.querySelectorAll('#characterTags .tag-item')).map(t => t.textContent.replace('×','').trim()),
        scene: document.querySelector('.form-section:nth-of-type(3) .form-textarea')?.value || '',
        bgm_style: document.getElementById('bgmStyle').value,
        creativity: document.querySelector('.form-section:nth-of-type(4) .slider')?.value || 70,
      };
    }

    // 保存模板
    function __saveTpl() {
      const params = getFormData();
      showSaveTemplateDialog('video', params, () => {
        showToast('模板保存成功，下次可直接套用', 'success');
      });
    }

    // 加载模板弹窗
    document.getElementById('loadTplBtn').addEventListener('click', async function() {
      const templates = await loadTemplates('video');
      if (!templates || templates.length === 0) {
        showToast('暂无保存的模板', 'info');
        return;
      }
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center;';
      modal.innerHTML = `
        <div style="background:#fff;border-radius:16px;padding:24px;width:420px;max-width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
          <h3 style="font-size:17px;font-weight:600;margin-bottom:16px;color:var(--text);">📂 选择模板</h3>
          <div id="tplList" style="margin-bottom:16px;"></div>
          <div style="display:flex;justify-content:flex-end;">
            <button class="action-btn" id="tplClose">关闭</button>
          </div>
        </div>
      `;
      const tplList = modal.querySelector('#tplList');
      tplList.innerHTML = templates.map(t => `
        <div data-id="${t.id}" style="padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--brand)'" onmouseout="this.style.borderColor='var(--border)'">
          <div style="font-size:14px;font-weight:500;color:var(--text);">${t.name}</div>
          <div style="font-size:11.5px;color:var(--text-3);margin-top:3px;">${new Date(t.created_at).toLocaleString()}</div>
        </div>
      `).join('');
      tplList.querySelectorAll('[data-id]').forEach(item => {
        item.onclick = function() {
          const tpl = templates.find(t => t.id == this.dataset.id);
          if (tpl && tpl.params) applyTemplate(tpl.params);
          modal.remove();
          showToast('模板已加载', 'success');
        };
      });
      modal.querySelector('#tplClose').onclick = () => modal.remove();
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
      document.body.appendChild(modal);
    });

    // 应用模板到表单
    function applyTemplate(params) {
      if (params.video_type) document.getElementById('videoType').value = params.video_type;
      if (params.theme) document.getElementById('videoTheme').value = params.theme;
      if (params.duration) document.getElementById('videoDuration').value = params.duration;
      if (params.selling_points) document.getElementById('sellingPoints').value = params.selling_points;
      if (params.count) document.getElementById('videoCount').value = params.count;
      if (params.bgm_style) document.getElementById('bgmStyle').value = params.bgm_style;
      updateCost();
    }

    // 生成函数
    async function doGenerate() {
      const btn = document.getElementById('generateBtn');
      const theme = document.getElementById('videoTheme').value.trim();
      const sellingPoints = document.getElementById('sellingPoints').value.trim();
      
      if (!theme) {
        showToast('请填写视频主题', 'error');
        return;
      }
      if (!sellingPoints) {
        showToast('请填写核心卖点/信息点', 'error');
        return;
      }
      
      btn.classList.add('loading');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-icon">⏳</span>生成中...';
      
      const formData = getFormData();
      
      try {
        const data = await apiRequest('/api/generate/video', {
          method: 'POST',
          body: JSON.stringify(formData)
        });
        
        if (data.code === 402 || data.code === 401) {
          showToast(data.msg, 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
          btn.innerHTML = '<span class="btn-icon">✨</span>生成脚本';
          if (data.code === 401) {
            setTimeout(() => window.location.href = '/login', 1000);
          }
          return;
        }
        if (data.code !== 0) {
          showToast(data.msg, 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
          btn.innerHTML = '<span class="btn-icon">✨</span>生成脚本';
          return;
        }
        
        // 更新积分
        if (data.data.new_balance != null) {
          const user = getUser();
          user.credits = data.data.new_balance;
          localStorage.setItem('user', JSON.stringify(user));
          updateNavAuth();
        }
        
        const versions = data.data.result || [];
        displayTextResults(versions, '短视频脚本');
        
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-icon">✨</span>重新生成';
        showToast('生成成功！' + versions.length + ' 个版本的脚本已生成', 'success');
        refreshUserInfo();
      } catch (err) {
        showToast('生成失败：' + err.message, 'error');
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-icon">✨</span>生成脚本';
      }
    }

    // Generate button
    document.getElementById('generateBtn').addEventListener('click', doGenerate);
    
    // 加载模型列表
    loadModels();
    
    // 监听变化
    document.getElementById('videoCount')?.addEventListener('input', updateCost);
    document.getElementById('llmModel')?.addEventListener('change', updateCost);
  </script>
</body>
</html>
