<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电商工作流 · AI工作室</title>
  <meta name="description" content="上传一张商品图，自动跑完抠图、场景主图、细节特写和详情页节点。每一步都能看到中间结果。">
  <link rel="stylesheet" href="css/style.css?v=18">
  <style>
    .wf-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 32px 90px;
    }

    .wf-hero { text-align: center; margin-bottom: 34px; }
    .wf-hero .wf-badge-top {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--brand-soft); color: var(--text-2);
      border-radius: 999px; padding: 7px 16px;
      font-size: 13px; margin-bottom: 16px;
    }
    .wf-hero h1 {
      font-size: clamp(26px, 3.6vw, 38px);
      line-height: 1.35; letter-spacing: -0.01em;
    }
    .wf-hero p {
      max-width: 620px; margin: 14px auto 0;
      color: var(--text-2); font-size: 15px; line-height: 1.8;
    }

    .wf-section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin: 40px 0 16px;
    }
    .wf-section-head h2 { font-size: 18px; }
    .wf-section-head span { font-size: 13px; color: var(--text-3); }

    /* 模板卡片 */
    .wf-templates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }
    .wf-tpl {
      position: relative;
      text-align: left;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      font: inherit;
      color: inherit;
    }
    .wf-tpl:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-hover); }
    .wf-tpl.active { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
    .wf-tpl-top { display: flex; align-items: center; gap: 12px; }
    .wf-tpl-emoji {
      width: 46px; height: 46px; flex: 0 0 46px;
      border-radius: 14px; background: var(--brand-soft);
      display: grid; place-items: center; font-size: 22px;
    }
    .wf-tpl h3 { font-size: 16px; line-height: 1.3; }
    .wf-tpl .wf-tpl-badge {
      position: absolute; top: 14px; right: 14px;
      background: var(--brand); color: #fff;
      font-size: 11px; padding: 3px 9px; border-radius: 999px;
    }
    .wf-tpl p { margin-top: 12px; font-size: 13px; color: var(--text-2); line-height: 1.65; }
    .wf-tpl-meta { display: flex; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--text-3); }
    .wf-tpl-meta b { color: var(--text-2); font-weight: 500; }

    /* 运行区 */
    .wf-layout {
      display: grid;
      grid-template-columns: 372px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      margin-top: 28px;
    }
    .wf-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      position: sticky;
      top: 90px;
    }
    .wf-panel-back {
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 13px; padding: 0;
      margin-bottom: 14px; font-family: inherit;
    }
    .wf-panel-back:hover { color: var(--text); }
    .wf-panel-title { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .wf-panel-title .emoji { font-size: 22px; }
    .wf-panel-title h2 { font-size: 17px; }
    .wf-panel-sub { font-size: 13px; color: var(--text-2); line-height: 1.65; margin-bottom: 20px; }

    .wf-field { margin-bottom: 18px; }
    .wf-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
    .wf-label i { color: var(--danger); font-style: normal; margin-left: 3px; }

    .wf-input-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; font-weight: 500; margin-bottom: 4px;
    }
    .wf-input-head i { color: var(--danger); font-style: normal; margin-left: 3px; }
    .wf-input-count { font-size: 12px; color: var(--text-3); font-weight: 400; }
    .wf-input-hint { font-size: 12px; color: var(--text-3); margin-bottom: 10px; }
    .wf-input-group { margin-bottom: 18px; }

    .wf-thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
    .wf-thumb {
      position: relative; width: 62px; height: 62px;
      border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    .wf-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wf-thumb button {
      position: absolute; top: 2px; right: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      border: none; background: rgba(60, 45, 35, .62); color: #fff;
      font-size: 11px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    }

    .wf-upload {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border: 1.5px dashed var(--border-hover);
      border-radius: var(--radius-sm);
      padding: 14px; cursor: pointer;
      color: var(--text-3); font-size: 13px;
      transition: border-color .18s, background .18s, color .18s;
      margin-top: 8px;
    }
    .wf-upload:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--text-2); }
    .wf-upload input { display: none; }

    .wf-select, .wf-input {
      width: 100%; padding: 11px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg-input); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none;
    }
    .wf-select:focus, .wf-input:focus { border-color: var(--border-focus); }
    .wf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .wf-cost {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--brand-soft); border-radius: var(--radius-sm);
      padding: 12px 14px; margin: 4px 0 14px; font-size: 13px;
    }
    .wf-cost b { font-size: 17px; color: var(--text); }
    .wf-cost span { color: var(--text-2); }

    .wf-run-btn {
      width: 100%; border: none; cursor: pointer;
      background: var(--brand); color: #fff;
      border-radius: var(--radius-sm); padding: 14px;
      font-size: 15px; font-weight: 500; font-family: inherit;
      transition: background .18s, transform .1s;
    }
    .wf-run-btn:hover { background: var(--brand-hover); }
    .wf-run-btn:active { transform: scale(.995); }
    .wf-run-btn:disabled { opacity: .55; cursor: not-allowed; }
    .wf-cancel-btn {
      width: 100%; margin-top: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text-2);
      border-radius: var(--radius-sm); padding: 11px;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .wf-cancel-btn:hover { border-color: var(--danger); color: var(--danger); }

    .wf-tip {
      font-size: 12px; color: var(--text-3); margin-top: 12px; line-height: 1.6;
    }
    .wf-tip a { color: var(--text-2); text-decoration: underline; }

    /* 流水线 */
    .wf-pipeline {
      display: flex; align-items: stretch;
      padding: 4px 2px 12px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .wf-node { flex: 0 0 196px; width: 196px; }
    .wf-connector {
      flex: 0 0 30px; width: 30px;
      display: grid; place-items: center;
      color: var(--text-light); font-size: 16px;
    }
    .wf-node-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      height: 100%;
      display: flex; flex-direction: column; gap: 9px;
      transition: border-color .2s, box-shadow .2s;
    }
    .wf-node-card.is-running { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
    .wf-node-card.is-done { border-color: var(--success); }
    .wf-node-card.is-failed { border-color: var(--danger); }
    .wf-node-head { display: flex; align-items: center; gap: 7px; }
    .wf-node-index {
      width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px;
      background: var(--bg-soft); color: var(--text-3);
      font-size: 11px; display: grid; place-items: center;
    }
    .wf-node-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wf-node-state { font-size: 11px; color: var(--text-3); white-space: nowrap; }
    .wf-node-card.is-running .wf-node-state { color: var(--brand-hover); }
    .wf-node-card.is-done .wf-node-state { color: #7a9c72; }
    .wf-node-card.is-failed .wf-node-state { color: #c07c72; }
    .wf-node-thumb {
      aspect-ratio: 1 / 1; border-radius: 10px;
      background: var(--bg-soft);
      display: grid; place-items: center;
      overflow: hidden; color: var(--text-light); font-size: 22px;
    }
    .wf-node-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .wf-node-note { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
    .wf-spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--brand-light); border-top-color: var(--brand);
      animation: wf-spin .8s linear infinite;
    }
    @keyframes wf-spin { to { transform: rotate(360deg); } }

    /* 结果 */
    .wf-result {
      margin-top: 26px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }
    .wf-result-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .wf-result-head h3 { font-size: 16px; }
    .wf-result-head span { font-size: 12px; color: var(--text-3); }
    .wf-result-main {
      border-radius: var(--radius); overflow: hidden;
      background: var(--bg-soft); display: grid; place-items: center;
      max-height: 560px;
    }
    .wf-result-main img { max-width: 100%; max-height: 560px; display: block; }
    .wf-result-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px; margin-top: 16px;
    }
    .wf-result-item { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-soft); }
    .wf-result-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
    .wf-result-item div { padding: 8px 10px; font-size: 11.5px; color: var(--text-3); display: flex; justify-content: space-between; gap: 6px; }
    .wf-result-item a { color: var(--text-2); }

    .wf-alert {
      border-radius: var(--radius-sm); padding: 13px 16px;
      font-size: 13px; line-height: 1.65; margin-top: 16px;
    }
    .wf-alert.error { background: var(--danger-bg); color: #a86a62; }
    .wf-alert.info { background: var(--warn-bg); color: #9e7c45; }

    /* 历史 */
    .wf-history { display: flex; flex-direction: column; gap: 10px; }
    .wf-history-item {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      cursor: pointer; text-align: left; width: 100%;
      font: inherit; color: inherit; transition: border-color .18s, box-shadow .18s;
    }
    .wf-history-item:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
    .wf-history-cover {
      width: 52px; height: 52px; flex: 0 0 52px; border-radius: 10px;
      background: var(--brand-soft); overflow: hidden;
      display: grid; place-items: center; font-size: 20px;
    }
    .wf-history-cover img { width: 100%; height: 100%; object-fit: cover; }
    .wf-history-main { flex: 1; min-width: 0; }
    .wf-history-main h4 { font-size: 14px; margin-bottom: 3px; }
    .wf-history-main p { font-size: 12px; color: var(--text-3); }
    .wf-history-status { font-size: 12px; color: var(--text-3); white-space: nowrap; }
    .wf-empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 26px 0; }

    @media (max-width: 960px) {
      .wf-layout { grid-template-columns: 1fr; }
      .wf-panel { position: static; }
    }
    @media (max-width: 760px) {
      .wf-page { padding: 26px 18px 70px; }
      .wf-pipeline { flex-direction: column; overflow: visible; }
      .wf-node { flex: none; width: 100%; }
      .wf-connector { flex: none; width: 100%; height: 26px; }
      .wf-connector span { transform: rotate(90deg); }
      .wf-node-card { flex-direction: row; align-items: center; }
      .wf-node-thumb { width: 64px; height: 64px; flex: 0 0 64px; aspect-ratio: auto; }
      .wf-node-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
      .wf-tpl-badge { display: none; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">🎨</div>
        <span class="logo-text">AI工作室</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">工作室</a>
        <a href="workflow.html" class="nav-link active">电商工作流</a>
        <a href="developer.html" class="nav-link">开发者平台</a>

        </div>
        <div id="navAuthLinks" style="display:flex;gap:8px;align-items:center;">
          <a href="/login" class="nav-link" style="padding:6px 14px;">登录</a>

        </div>

      </div>
    </div>
  </nav>

  <main class="wf-page">
    <header class="wf-hero">
      <div class="wf-badge-top">⚡ 节点式电商工作流</div>
      <h1>上传一张商品图<br>整条出图流水线自动跑完</h1>
      <p>抠图、场景主图、细节特写、详情页，串成节点一次跑完。每个节点都能看到中间结果，哪一步不满意就单独重跑。</p>
    </header>

    <section>
      <div class="wf-section-head">
        <h2>选择工作流</h2>
        <span>按节点数计费，跑一步扣一步</span>
      </div>
      <div class="wf-templates" id="templateList">
        <div class="wf-empty">加载中...</div>
      </div>
    </section>

    <section id="runSection" hidden>
      <div class="wf-layout">
        <aside class="wf-panel">
          <button class="wf-panel-back" id="backBtn" type="button">← 换一个工作流</button>

          <div id="panelForm">
            <div class="wf-panel-title">
              <span class="emoji" id="tplEmoji">🛠️</span>
              <h2 id="tplName">工作流</h2>
            </div>
            <p class="wf-panel-sub" id="tplSummary"></p>

            <div id="inputGroups"></div>

            <div class="wf-field">
              <label class="wf-label" for="modelSelect">生图模型 <i>*</i></label>
              <select class="wf-select" id="modelSelect"></select>
            </div>

            <div class="wf-field">
              <label class="wf-label">画面比例与清晰度</label>
              <div class="wf-row">
                <select class="wf-select" id="ratioSelect">
                  <option value="1:1">1:1 方形</option>
                  <option value="3:4">3:4 竖版</option>
                  <option value="4:3">4:3 横版</option>
                </select>
                <select class="wf-select" id="qualitySelect">
                  <option value="1K">1K 标准</option>
                  <option value="2K">2K 高清</option>
                </select>
              </div>
            </div>

            <div class="wf-cost">
              <span id="costBreakdown">等待选择模型</span>
              <b id="costTotal">--</b>
            </div>

            <button class="wf-run-btn" id="runBtn" type="button">开始生成</button>
            <button class="wf-cancel-btn" id="cancelBtn" type="button" hidden>取消这次工作流</button>
            <p class="wf-tip" id="modelTip" hidden>当前没有可用的生图模型，请先到 <a href="/admin/">后台 · 模型管理</a> 添加一个支持图生图的模型。</p>
          </div>

          <div id="panelRunView" hidden>
            <div class="wf-panel-title">
              <span class="emoji" id="runEmoji">🛠️</span>
              <h2 id="runName">运行记录</h2>
            </div>
            <p class="wf-panel-sub" id="runSummary"></p>
            <button class="wf-run-btn" id="againBtn" type="button">用这个工作流再跑一次</button>
            <button class="wf-cancel-btn" id="closeRunBtn" type="button">回到工作流列表</button>
          </div>
        </aside>

        <div>
          <div class="wf-pipeline" id="pipeline"></div>
          <div id="resultSection"></div>
        </div>
      </div>
    </section>

    <section>
      <div class="wf-section-head">
        <h2>我最近的工作流</h2>
        <span id="historyHint"></span>
      </div>
      <div class="wf-history" id="historyList">
        <div class="wf-empty">登录后可以查看历史记录</div>
      </div>
    </section>
  </main>

  <script src="js/common.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
  <script>
    const state = {
      templates: [],
      models: [],
      current: null,
      inputs: {},
      runId: null,
      mode: 'new',
      poll: null,
      estimate: null,
      lastRun: null
    };

    const STATUS_TEXT = {
      pending: '等待',
      running: '生成中',
      succeeded: '完成',
      failed: '失败',
      canceled: '已取消'
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function api(path, options) {
      return apiRequest(path, options);
    }

    // ============ 模板 ============
    async function loadTemplates() {
      const box = document.getElementById('templateList');
      const res = await api('/api/workflow/templates');
      if (res.code !== 0) {
        box.innerHTML = '<div class="wf-empty">工作流加载失败：' + escapeHtml(res.msg || '请稍后重试') + '</div>';
        return;
      }
      state.templates = res.data || [];
      if (!state.templates.length) {
        box.innerHTML = '<div class="wf-empty">还没有可用的工作流</div>';
        return;
      }
      box.innerHTML = state.templates.map(tpl => `
        <button class="wf-tpl" type="button" data-template="${tpl.id}">
          ${tpl.badge ? '<span class="wf-tpl-badge">' + escapeHtml(tpl.badge) + '</span>' : ''}
          <div class="wf-tpl-top">
            <div class="wf-tpl-emoji">${escapeHtml(tpl.emoji)}</div>
            <h3>${escapeHtml(tpl.name)}</h3>
          </div>
          <p>${escapeHtml(tpl.summary)}</p>
          <div class="wf-tpl-meta">
            <span><b>${tpl.node_count}</b> 个节点</span>
            <span>·</span>
            <span>${tpl.inputs.map(i => escapeHtml(i.label)).join(' + ')}</span>
          </div>
        </button>
      `).join('');
      box.querySelectorAll('[data-template]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tpl = state.templates.find(item => String(item.id) === btn.dataset.template);
          if (tpl) selectTemplate(tpl);
        });
      });
    }

    function selectTemplate(tpl) {
      state.mode = 'new';
      state.current = tpl;
      state.inputs = {};
      state.runId = null;
      state.lastRun = null;
      stopPolling();

      document.querySelectorAll('.wf-tpl').forEach(el => {
        el.classList.toggle('active', String(el.dataset.template) === String(tpl.id));
      });

      document.getElementById('runSection').hidden = false;
      document.getElementById('panelForm').hidden = false;
      document.getElementById('panelRunView').hidden = true;
      document.getElementById('tplEmoji').textContent = tpl.emoji;
      document.getElementById('tplName').textContent = tpl.name;
      document.getElementById('tplSummary').textContent = tpl.summary;

      renderInputs();
      renderPipeline(tpl.nodes.map(node => ({ ...node, status: 'pending', preview: '' })));
      document.getElementById('resultSection').innerHTML = '';
      updateEstimate();
      document.getElementById('runSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ============ 上传 ============
    function renderInputs() {
      const box = document.getElementById('inputGroups');
      if (!state.current) { box.innerHTML = ''; return; }
      box.innerHTML = state.current.inputs.map(group => `
        <div class="wf-input-group" data-group="${escapeHtml(group.key)}">
          <div class="wf-input-head">
            <span>${escapeHtml(group.label)}${group.required ? '<i>*</i>' : ''}</span>
            <span class="wf-input-count" data-count="${escapeHtml(group.key)}">0 / ${group.max}</span>
          </div>
          <div class="wf-input-hint">${escapeHtml(group.hint)}</div>
          <div class="wf-thumbs" data-thumbs="${escapeHtml(group.key)}"></div>
          <label class="wf-upload">
            <input type="file" accept="image/png,image/jpeg,image/webp" multiple data-input="${escapeHtml(group.key)}">
            <span>＋ 点击上传</span>
          </label>
        </div>
      `).join('');
      box.querySelectorAll('input[type="file"]').forEach(input => {
        input.addEventListener('change', event => {
          addFiles(input.dataset.input, Array.from(event.target.files || []));
          event.target.value = '';
        });
      });
      renderThumbs();
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(objectUrl);
          const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          resolve(canvas.toDataURL(type, 0.9));
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('图片读取失败'));
        };
        img.src = objectUrl;
      });
    }

    async function addFiles(key, files) {
      if (!state.current) return;
      const group = state.current.inputs.find(item => item.key === key);
      if (!group) return;
      const list = state.inputs[key] || [];
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        if (list.length >= group.max) {
          showToast(group.label + '最多 ' + group.max + ' 张', 'warn');
          break;
        }
        try {
          const dataUrl = await compressImage(file);
          list.push(dataUrl);
        } catch (error) {
          showToast(error.message, 'error');
        }
      }
      state.inputs[key] = list;
      renderThumbs();
      updateEstimate();
    }

    function renderThumbs() {
      if (!state.current) return;
      for (const group of state.current.inputs) {
        const list = state.inputs[group.key] || [];
        const box = document.querySelector('[data-thumbs="' + group.key + '"]');
        const counter = document.querySelector('[data-count="' + group.key + '"]');
        if (counter) counter.textContent = list.length + ' / ' + group.max;
        if (!box) continue;
        box.innerHTML = list.map((src, index) => `
          <div class="wf-thumb">
            <img src="${src}" alt="">
            <button type="button" data-remove="${group.key}" data-index="${index}" title="移除">×</button>
          </div>
        `).join('');
      }
      document.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.remove;
          const index = Number(btn.dataset.index);
          state.inputs[key] = (state.inputs[key] || []).filter((_, i) => i !== index);
          renderThumbs();
          updateEstimate();
        });
      });
    }

    // ============ 模型与价格 ============
    async function loadModels() {
      const select = document.getElementById('modelSelect');
      const res = await api('/api/models?type=image');
      if (res.code !== 0) {
        select.innerHTML = '<option value="">模型加载失败</option>';
        return;
      }
      state.models = res.data || [];
      const tip = document.getElementById('modelTip');
      const runBtn = document.getElementById('runBtn');
      if (!state.models.length) {
        select.innerHTML = '<option value="">暂无可用模型</option>';
        tip.innerHTML = '当前没有可用的生图模型，请先到 <a href="/admin/">后台 · 模型管理</a> 添加一个支持图生图的模型。';
        tip.hidden = false;
        runBtn.disabled = true;
        return;
      }
      // 演示模型只返回占位图，无法作为下一个节点的参考图，直接拦在提交前
      const demoOnly = state.models.every(model => /api\.example\.com/i.test(model.api_endpoint || ''));
      if (demoOnly) {
        tip.innerHTML = '当前是演示模型（尚未配置真实接口），工作流需要支持图生图（/images/edits）的模型。请先在 <a href="/admin/">后台 · 模型管理</a> 配置真实模型，否则节点之间无法传递图片。';
        tip.hidden = false;
        runBtn.disabled = true;
      } else {
        tip.hidden = true;
        runBtn.disabled = false;
      }
      select.innerHTML = state.models.map(model => `
        <option value="${model.id}">${escapeHtml(model.name)} · ${model.price_per_call} 积分/次</option>
      `).join('');
      updateEstimate();
    }

    async function updateEstimate() {
      if (!state.current) return;
      const modelId = Number(document.getElementById('modelSelect').value);
      if (!modelId) {
        document.getElementById('costTotal').textContent = '--';
        document.getElementById('costBreakdown').textContent = '等待选择模型';
        return;
      }
      const res = await api('/api/workflow/estimate', {
        method: 'POST',
        body: JSON.stringify({ template_id: state.current.id, model_id: modelId })
      });
      if (res.code !== 0) {
        document.getElementById('costTotal').textContent = '--';
        document.getElementById('costBreakdown').textContent = res.msg || '价格不可用';
        return;
      }
      state.estimate = res.data;
      document.getElementById('costBreakdown').textContent =
        res.data.node_count + ' 个节点 × ' + res.data.unit_cost + ' 积分';
      document.getElementById('costTotal').textContent = res.data.total_cost + ' 积分';
    }

    // ============ 流水线渲染 ============
    function nodeStateClass(status) {
      if (status === 'running') return 'is-running';
      if (status === 'succeeded') return 'is-done';
      if (status === 'failed' || status === 'canceled') return 'is-failed';
      return '';
    }

    function renderPipeline(nodes) {
      const box = document.getElementById('pipeline');
      box.innerHTML = nodes.map((node, index) => {
        const status = node.status || 'pending';
        let thumb;
        if (node.preview) {
          thumb = '<img src="' + node.preview + '" alt="' + escapeHtml(node.name) + '">';
        } else if (status === 'running') {
          thumb = '<div class="wf-spinner"></div>';
        } else {
          thumb = '<span>' + (status === 'failed' ? '⚠️' : '🖼️') + '</span>';
        }
        const connector = index < nodes.length - 1
          ? '<div class="wf-connector"><span>→</span></div>'
          : '';
        return `
          <div class="wf-node" data-node="${escapeHtml(node.key || index)}">
            <div class="wf-node-card ${nodeStateClass(status)}">
              <div class="wf-node-thumb">${thumb}</div>
              <div class="wf-node-body">
                <div class="wf-node-head">
                  <span class="wf-node-index">${index + 1}</span>
                  <span class="wf-node-name">${escapeHtml(node.name)}</span>
                  <span class="wf-node-state">${STATUS_TEXT[status] || ''}</span>
                </div>
                <div class="wf-node-note">${escapeHtml(node.note || '')}</div>
              </div>
            </div>
          </div>
          ${connector}
        `;
      }).join('');
    }

    // ============ 提交与轮询 ============
    async function startRun() {
      if (!isLoggedIn()) {
        showToast('请先登录', 'error');
        setTimeout(() => {
          window.location.href = '/login?redirect=' + encodeURIComponent('/workflow.html');
        }, 900);
        return;
      }
      if (!state.current) return;
      const modelId = Number(document.getElementById('modelSelect').value);
      if (!modelId) {
        showToast('请选择生图模型', 'error');
        return;
      }
      for (const group of state.current.inputs) {
        const count = (state.inputs[group.key] || []).length;
        if (group.required && count < group.min) {
          showToast('请上传' + group.label, 'error');
          return;
        }
      }

      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = '正在提交...';

      const res = await api('/api/workflow/runs', {
        method: 'POST',
        body: JSON.stringify({
          template_id: state.current.id,
          model_id: modelId,
          ratio: document.getElementById('ratioSelect').value,
          quality: document.getElementById('qualitySelect').value,
          inputs: state.inputs
        })
      });

      btn.textContent = '开始生成';
      btn.disabled = false;

      if (res.code === 401) {
        showToast('登录已过期，请重新登录', 'error');
        setTimeout(() => { window.location.href = '/login?redirect=/workflow.html'; }, 900);
        return;
      }
      if (res.code !== 0) {
        showToast(res.msg || '提交失败', 'error');
        return;
      }

      state.runId = res.data.id;
      state.mode = 'run';
      renderRun(res.data);
      startPolling();
      showToast('工作流已启动，共 ' + res.data.total_nodes + ' 个节点', 'success');
    }

    function startPolling() {
      stopPolling();
      state.poll = setInterval(pollRun, 2000);
      pollRun();
    }

    function stopPolling() {
      if (state.poll) {
        clearInterval(state.poll);
        state.poll = null;
      }
    }

    async function pollRun() {
      if (!state.runId) return;
      const res = await api('/api/workflow/runs/' + state.runId);
      if (res.code !== 0) return;
      renderRun(res.data);
      if (['succeeded', 'failed', 'canceled'].includes(res.data.status)) {
        stopPolling();
        if (typeof refreshUserInfo === 'function') refreshUserInfo();
        loadHistory();
      }
    }

    function renderRun(run) {
      state.lastRun = run;
      renderPipeline(run.nodes || []);

      const running = run.status === 'pending' || run.status === 'running';
      const runBtn = document.getElementById('runBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      if (state.mode === 'run') {
        runBtn.disabled = running;
        runBtn.textContent = running ? '生成中 ' + run.done_nodes + '/' + run.total_nodes : '开始生成';
        cancelBtn.hidden = !running;
      } else {
        runBtn.disabled = false;
        runBtn.textContent = '开始生成';
        cancelBtn.hidden = true;
      }

      const box = document.getElementById('resultSection');
      if (run.status === 'succeeded') {
        const items = (run.nodes || []).filter(node => node.preview);
        box.innerHTML = `
          <div class="wf-result">
            <div class="wf-result-head">
              <h3>全部完成</h3>
              <span>共 ${run.total_nodes} 个节点 · 消耗 ${run.total_cost} 积分</span>
            </div>
            ${run.final_image ? '<div class="wf-result-main"><img src="' + run.final_image + '" alt="最终结果"></div>' : ''}
            <div class="wf-result-grid">
              ${items.map(node => `
                <div class="wf-result-item">
                  <a href="${node.preview}" target="_blank" rel="noopener"><img src="${node.preview}" alt="${escapeHtml(node.name)}"></a>
                  <div><span>${escapeHtml(node.name)}</span><a href="${node.preview}" download>下载</a></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (run.status === 'failed') {
        box.innerHTML = '<div class="wf-alert error"><b>工作流失败：</b>' + escapeHtml(run.error_msg || '未知错误') +
          '<br>已完成的节点不会重复扣费，失败节点的积分会自动退回。</div>';
      } else if (run.status === 'canceled') {
        box.innerHTML = '<div class="wf-alert info">这次工作流已取消，进行中的节点积分已退回。</div>';
      } else {
        box.innerHTML = '';
      }
    }

    async function cancelRun() {
      if (!state.runId) return;
      const res = await api('/api/workflow/runs/' + state.runId + '/cancel', { method: 'POST' });
      if (res.code !== 0) {
        showToast(res.msg || '取消失败', 'error');
        return;
      }
      stopPolling();
      renderRun(res.data);
      showToast('已取消', 'success');
    }

    // ============ 历史记录 ============
    async function loadHistory() {
      const box = document.getElementById('historyList');
      if (!isLoggedIn()) {
        box.innerHTML = '<div class="wf-empty">登录后可以查看历史记录</div>';
        return;
      }
      const res = await api('/api/workflow/runs?limit=10');
      if (res.code !== 0) {
        box.innerHTML = '<div class="wf-empty">历史记录加载失败</div>';
        return;
      }
      const runs = res.data || [];
      document.getElementById('historyHint').textContent = runs.length ? '点击可查看每个节点的结果' : '';
      if (!runs.length) {
        box.innerHTML = '<div class="wf-empty">还没有跑过工作流，选一个模板开始吧</div>';
        return;
      }
      box.innerHTML = runs.map(run => `
        <button class="wf-history-item" type="button" data-run="${run.id}">
          <div class="wf-history-cover">${run.cover ? '<img src="' + run.cover + '" alt="">' : escapeHtml(run.template_emoji || '🛠️')}</div>
          <div class="wf-history-main">
            <h4>${escapeHtml(run.template_name)}</h4>
            <p>${escapeHtml(run.created_at || '')} · ${run.done_nodes}/${run.total_nodes} 个节点 · ${run.total_cost} 积分</p>
          </div>
          <span class="wf-history-status">${STATUS_TEXT[run.status] || run.status}</span>
        </button>
      `).join('');
      box.querySelectorAll('[data-run]').forEach(btn => {
        btn.addEventListener('click', () => viewRun(btn.dataset.run));
      });
    }

    async function viewRun(id) {
      const res = await api('/api/workflow/runs/' + id);
      if (res.code !== 0) {
        showToast(res.msg || '读取失败', 'error');
        return;
      }
      const run = res.data;
      state.mode = 'run';
      state.runId = run.id;
      document.getElementById('runSection').hidden = false;
      document.getElementById('panelForm').hidden = true;
      document.getElementById('panelRunView').hidden = false;
      document.getElementById('runEmoji').textContent = run.template_emoji;
      document.getElementById('runName').textContent = run.template_name;
      document.getElementById('runSummary').textContent =
        (run.created_at || '') + ' · ' + run.done_nodes + '/' + run.total_nodes + ' 个节点 · 消耗 ' + run.total_cost + ' 积分';
      renderRun(run);
      if (run.status === 'pending' || run.status === 'running') startPolling();
      else stopPolling();
      document.getElementById('runSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function backToTemplates() {
      stopPolling();
      state.current = null;
      state.runId = null;
      state.mode = 'new';
      document.getElementById('runSection').hidden = true;
      document.querySelectorAll('.wf-tpl').forEach(el => el.classList.remove('active'));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function again() {
      const run = state.lastRun;
      if (!run) return backToTemplates();
      const tpl = state.templates.find(item => String(item.id) === String(run.template_id));
      if (tpl) selectTemplate(tpl);
      else backToTemplates();
    }

    // ============ 初始化 ============
    document.getElementById('runBtn').addEventListener('click', startRun);
    document.getElementById('cancelBtn').addEventListener('click', cancelRun);
    document.getElementById('backBtn').addEventListener('click', backToTemplates);
    document.getElementById('closeRunBtn').addEventListener('click', backToTemplates);
    document.getElementById('againBtn').addEventListener('click', again);
    document.getElementById('modelSelect').addEventListener('change', updateEstimate);

    (async function init() {
      await Promise.all([loadTemplates(), loadModels()]);
      await loadHistory();
    })();
  </script>
</body>
</html>
