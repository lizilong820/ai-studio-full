<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · AI工作室</title>
  <link rel="stylesheet" href="css/style.css?v=17">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #FFF9F0 0%, #FDF0E0 100%);
      position: relative;
    }
    .auth-page::before {
      content: "";
      position: absolute;
      top: -200px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(232, 196, 160, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 10px 40px rgba(200, 170, 140, 0.15);
      border: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: var(--brand-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 14px;
    }
    .auth-logo h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .auth-logo p {
      font-size: 14px;
      color: var(--text-2);
    }
    .auth-form .form-group {
      margin-bottom: 20px;
    }
    .auth-form .form-input {
      padding: 13px 18px;
      font-size: 15px;
    }
    .auth-form .form-label {
      margin-bottom: 8px;
      font-size: 14px;
    }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: var(--brand);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .auth-btn:hover {
      background: var(--brand-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212, 184, 150, 0.35);
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-2);
    }
    .auth-footer a {
      color: var(--brand);
      font-weight: 500;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: var(--text-3);
      font-size: 12px;
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .back-home {
      text-align: center;
      margin-top: 20px;
    }
    .back-home a {
      font-size: 13px;
      color: var(--text-3);
    }
    .back-home a:hover {
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">🎨</div>
        <h1>欢迎回来</h1>
        <p>登录 AI工作室，开启创意之旅</p>
      </div>
      
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="username" placeholder="请输入用户名" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
        </div>
        
        <button type="submit" class="auth-btn" id="submitBtn">登 录</button>
      </form>
      
      <div class="auth-divider">其他登录方式</div>
      
      <div style="display:flex;gap:12px;justify-content:center;margin-bottom:8px;">
        <button onclick="showToast('微信登录即将上线', 'info')" style="flex:1;padding:11px;background:#07C160;color:#fff;border:none;border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:500;transition:all 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
          💚 微信登录
        </button>
        <button onclick="showToast('手机号登录即将上线', 'info')" style="flex:1;padding:11px;background:#fff;color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:13.5px;cursor:pointer;font-weight:500;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--brand)';this.style.color='var(--brand)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text)'">
          📱 手机号
        </button>
      </div>
      <p style="text-align:center;font-size:11px;color:var(--text-3);">即将开放，敬请期待~</p>
      
      <div class="auth-footer">
        还没有账号？ <a href="/register">立即注册</a>
      </div>
      
      <div class="back-home">
        <a href="/">← 返回首页</a>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=17"></script>
  <script>
    // 如果已登录，跳转到首页
    const token = localStorage.getItem('token');
    if (token) {
      window.location.href = '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showToast('请填写用户名和密码', 'error');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = '登录中...';
      
      try {
        const res = await fetch('/api/user/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (data.code === 0) {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data.user));
          showToast('登录成功', 'success');
          
          // 管理员跳管理后台
          if (data.data.user.is_admin) {
            setTimeout(() => window.location.href = '/admin', 800);
          } else {
            setTimeout(() => window.location.href = '/', 800);
          }
        } else {
          showToast(data.msg, 'error');
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      } catch (err) {
        showToast('网络错误，请重试', 'error');
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
